<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 修复1：增加 viewport-fit=cover 适配手机底部安全区 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>🌸樱花打卡</title>
<style>
:root {
  --primary: #9b59b6;
  --bg: #fdf0f5;
  --card: #ffffff;
  --text: #4a4a4a;
}
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  /* 修复2：用 100dvh (动态视口) + 100vh 兜底，解决 Safari 地址栏遮挡 */
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start; /* 修复3：改为顶部对齐，防止底部被挤没 */
  padding: 20px 15px;
  box-sizing: border-box;
}
.card {
  background: var(--card);
  width: 100%;
  max-width: 400px;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(155, 89, 182, 0.15);
  box-sizing: border-box;
  /* 修复4：底部留出安全区距离，防止被手机手势条遮挡 */
  margin-bottom: env(safe-area-inset-bottom, 20px);
}
h1 {
  color: var(--primary);
  margin: 0 0 8px;
  font-size: 28px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.date { font-size: 15px; opacity: 0.8; margin-bottom: 4px; }
.desc { font-size: 15px; margin-bottom: 16px; }
.progress-bar {
  height: 10px;
  background: #f0e6f6;
  border-radius: 5px;
  margin: 12px 0 20px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  border-radius: 5px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 20px;
}
.day-name {
  text-align: center;
  font-size: 13px;
  opacity: 0.6;
  margin-bottom: 4px;
}
.day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f7f0fa;
  border-radius: 10px;
  font-size: 14px;
  color: #666;
}
.day.today { border: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
.day.done { background: var(--primary); color: #fff; }
.btns {
  display: flex;
  gap: 10px;
  /* 修复5：确保按钮区域不被截断 */
  padding-bottom: 10px; 
}
.btn {
  flex: 1;
  padding: 12px 0;
  border: none;
  border-radius: 20px;
  background: #f0e6f6;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.btn.active {
  background: var(--primary);
  color: #fff;
}
</style>
</head>
<body>
  <div class="card">
    <h1>🌸 樱花打卡</h1>
    <div class="date" id="date"></div>
    <div class="desc">今天也要加油呀 💜</div>
    <div>今日：<span id="todayCnt">0</span>/3</div>
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
    <div>🔥 连续 <span id="streak">0</span> 天</div>
    
    <div class="calendar" id="cal">
      <div class="day-name">日</div><div class="day-name">一</div><div class="day-name">二</div>
      <div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div>
    </div>
    
    <div class="btns">
      <button class="btn active" onclick="checkin()">每日</button>
      <button class="btn">挑战</button>
      <button class="btn">一次</button>
      <button class="btn" onclick="reset()">完成</button>
    </div>
  </div>

<script>
const d = new Date();
document.getElementById('date').innerText = `${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`;
const cal = document.getElementById('cal');
const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const firstDay = new Date(d.getFullYear(), d.getMonth(), 1).getDay();
for(let i=0; i<firstDay; i++) cal.appendChild(document.createElement('div'));
for(let i=1; i<=daysInMonth; i++){
  const el = document.createElement('div');
  el.className = 'day';
  el.innerText = i;
  if(i === d.getDate()) el.classList.add('today');
  cal.appendChild(el);
}
let cnt = 0;
function checkin(){
  cnt = Math.min(cnt+1, 3);
  document.getElementById('todayCnt').innerText = cnt;
  document.getElementById('prog').style.width = (cnt/3 * 100)+'%';
  if(cnt===3) document.getElementById('streak').innerText = parseInt(document.getElementById('streak').innerText)+1;
}
function reset(){ cnt=0; document.getElementById('todayCnt').innerText=0; document.getElementById('prog').style.width='0%'; }
</script>
</body>
</html>
