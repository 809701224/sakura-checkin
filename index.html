<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌸樱花打卡</title>
<style>
  :root {
    --primary: #9b59b6;
    --bg: #fdf0f5;
    --card: #ffffff;
    --text: #4a4a4a;
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .app {
    background: var(--card);
    width: 90%;
    max-width: 400px;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(155, 89, 182, 0.15);
  }
  h1 {
    color: var(--primary);
    font-size: 28px;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date {
    font-size: 16px;
    color: #888;
    margin-bottom: 8px;
  }
  .motto {
    font-size: 15px;
    margin-bottom: 16px;
  }
  .progress-box {
    margin-bottom: 16px;
  }
  .progress-text {
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: bold;
  }
  .progress-bar {
    height: 12px;
    background: #f0e6f6;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-inner {
    height: 100%;
    background: var(--primary);
    width: 0%;
    border-radius: 6px;
    transition: width 0.3s;
  }
  .streak {
    font-size: 16px;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 20px;
  }
  .day-name {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    background: #f5eef8;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #777;
    cursor: pointer;
  }
  .day.checked {
    background: var(--primary);
    color: #fff;
  }
  .day.today {
    border: 2px solid var(--primary);
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    border-radius: 20px;
    background: #f5eef8;
    color: var(--text);
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--primary);
    color: #fff;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🌸 樱花打卡</h1>
    <div class="date" id="date"></div>
    <div class="motto">今天也要加油呀 💜</div>
    
    <div class="progress-box">
      <div class="progress-text" id="progressText">今日：0/3</div>
      <div class="progress-bar">
        <div class="progress-inner" id="progressInner"></div>
      </div>
    </div>
    
    <div class="streak" id="streak">🔥 连续 0 天</div>
    
    <div class="calendar" id="calendar">
      <div class="day-name">日</div><div class="day-name">一</div>
      <div class="day-name">二</div><div class="day-name">三</div>
      <div class="day-name">四</div><div class="day-name">五</div>
      <div class="day-name">六</div>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="setTab('daily')">每日</button>
      <button class="tab" onclick="setTab('challenge')">挑战</button>
      <button class="tab" onclick="setTab('once')">一次</button>
      <button class="tab" onclick="checkDone()">完成</button>
    </div>
  </div>

<script>
  const today = new Date();
  document.getElementById('date').innerText = 
    `${today.getMonth()+1}月${today.getDate()}日 星期${'日一二三四五六'[today.getDay()]}`;
  
  let checkedDays = JSON.parse(localStorage.getItem('sakura_checked') || '[]');
  let todayCount = parseInt(localStorage.getItem('sakura_today') || '0');
  const target = 3;

  function render() {
    const cal = document.getElementById('calendar');
    cal.innerHTML = `<div class="day-name">日</div><div class="day-name">一</div><div class="day-name">二</div><div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div>`;
    
    let firstDay = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
    let days = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    
    for(let i=0; i<firstDay; i++) cal.appendChild(document.createElement('div'));
    for(let i=1; i<=days; i++) {
      let d = document.createElement('div');
      d.className = 'day';
      d.innerText = i;
      let dateStr = `${today.getMonth()+1}-${i}`;
      if(checkedDays.includes(dateStr)) d.classList.add('checked');
      if(i === today.getDate()) d.classList.add('today');
      d.onclick = () => toggleDay(dateStr, d);
      cal.appendChild(d);
    }
    
    document.getElementById('progressText').innerText = `今日：${todayCount}/${target}`;
    document.getElementById('progressInner').style.width = Math.min(100, todayCount/target*100)+'%';
    
    let streak = 0;
    for(let i=0; i<31; i++) {
      let d = new Date(today); d.setDate(today.getDate()-i);
      let ds = `${d.getMonth()+1}-${d.getDate()}`;
      if(checkedDays.includes(ds)) streak++;
      else break;
    }
    document.getElementById('streak').innerText = `🔥 连续 ${streak} 天`;
  }
  
  function toggleDay(ds, el) {
    if(checkedDays.includes(ds)) {
      checkedDays = checkedDays.filter(x=>x!==ds);
      el.classList.remove('checked');
    } else {
      checkedDays.push(ds);
      el.classList.add('checked');
    }
    localStorage.setItem('sakura_checked', JSON.stringify(checkedDays));
    render();
  }
  
  function setTab(t) {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    event.target.classList.add('active');
  }
  
  function checkDone() {
    if(todayCount < target) {
      todayCount++;
      localStorage.setItem('sakura_today', todayCount);
    }
    render();
  }
  
  render();
</script>
</body>
</html>
